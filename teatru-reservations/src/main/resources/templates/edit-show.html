<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editează Spectacol</title>
</head>
<body>
<h1>Editează Spectacol</h1>

<form th:action="@{/admin/save-show}" method="post">
    <input type="hidden" name="id" th:value="${show.id}" />
    <label for="title">Titlu:</label>
    <input type="text" id="title" name="title" th:value="${show.title}" required />
    <br />
    <label for="date">Data:</label>
    <input type="datetime-local" id="date" name="showDate" th:value="${formattedShowDate}" required />
    <br />
    <label for="duration">Durata (minute):</label>
    <input type="number" id="duration" name="durationMinutes" th:value="${show.durationMinutes}" required />
    <br />
    <button type="submit">Salvează</button>
</form>

<a href="/admin">Înapoi la Dashboard</a>
</body>
</html>
