<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adaugă Spectacol</title>
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
</head>
<body>
<h1>Adaugă un Spectacol Nou</h1>

<form th:action="@{/admin/add-show}" th:object="${show}" method="post">
    <label for="title">Titlu:</label>
    <input type="text" id="title" name="title" th:value="*{title}" required />
    <br />

    <label for="showDateString">Data și Ora:</label>
    <input type="datetime-local" id="showDateString" name="showDateString" required />
    <br />

    <label for="durationMinutes">Durata (minute):</label>
    <input type="number" id="durationMinutes" name="durationMinutes" th:value="*{durationMinutes}" required />
    <br />

    <label for="idHall">ID-ul Sălii:</label>
    <input type="number" id="idHall" name="idHall" th:value="*{idHall}" required />
    <br />

    <button type="submit">Adaugă Spectacol</button>
</form>

<a href="/admin">Înapoi la Dashboard</a>
</body>
</html>
